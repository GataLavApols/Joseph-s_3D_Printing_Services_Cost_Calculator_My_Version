<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Joseph's 3D Printing Services — Cost Calculator</title>
<style>
  :root {
    --bg: #111827;
    --bg-2: #1f2937;
    --card: #1f2937;
    --card-2: #374151;
    --accent: #3b82f6;
    --accent-hover: #2563eb;
    --accent-soft: rgba(59, 130, 246, .18);
    --text: #f3f4f6;
    --muted: #9ca3af;
    --border: #4b5563;
    --input-bg: #111827;
    --green: #60a5fa;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    background: linear-gradient(180deg, #030712 0%, var(--bg) 40%, #1a2233 100%);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .app {
    width: 100%;
    max-width: 520px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 28px;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
  h1 {
    margin: 0 0 4px;
    font-size: 1.5rem;
    letter-spacing: .2px;
    color: #fff;
  }
  h1 span { color: var(--accent); }
  .subtitle { color: var(--muted); margin: 0 0 8px; font-size: .95rem; }
  label { display:block; font-size: .85rem; color: var(--muted); margin: 14px 0 6px; }
  select, input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--input-bg);
    color: var(--text);
    font-size: 1rem;
    outline: none;
  }
  select:focus, input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .hint { font-size: .78rem; color: var(--muted); margin-top: 6px; }
  .btns { display:flex; gap:10px; margin-top:20px; }
  button {
    flex:1;
    padding: 13px;
    border-radius: 12px;
    border: 0;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
  }
  .calc { background: var(--accent); color: #fff; }
  .calc:hover { background: var(--accent-hover); }
  .reset { background: var(--card-2); color: var(--text); border: 1px solid var(--border); }
  .reset:hover { background: #4b5563; }
  .result {
    margin-top: 20px;
    background: #111827;
    border: 1px solid var(--border);
    border-left: 4px solid var(--accent);
    border-radius: 14px;
    padding: 16px;
    display: none;
  }
  .result.show { display:block; }
  .line { display:flex; justify-content:space-between; padding:6px 0; font-size:.95rem; color:#d1d5db; }
  .line.total { border-top:1px solid var(--border); margin-top:8px; padding-top:12px; font-size:1.15rem; color:#fff; font-weight:800; }
  .line.total span:last-child { color: var(--accent); }
  .error { color:#fca5a5; font-size:.85rem; margin-top:10px; min-height:1.2em; }
</style>
</head>
<body>
  <main class="app">
    <h1>Joseph's 3D Printing <span>Cost Calculator</span></h1>
    <p class="subtitle">Realistic pricing for your 3D printing service.</p>

    <label for="filament">Type of Filament</label>
    <select id="filament">
      <option value="PLA">PLA</option>
      <option value="PLA+">PLA+</option>
      <option value="PETG">PETG</option>
      <option value="ABS">ABS</option>
      <option value="ASA">ASA</option>
      <option value="TPU">TPU (Flexible)</option>
      <option value="Nylon">Nylon</option>
      <option value="Resin (Standard)">Resin (Standard)</option>
    </select>

    <label for="grams">Amount of filament used (in grams)</label>
    <input id="grams" type="number" min="0" step="0.1" placeholder="e.g. 120" />

    <label for="hours">Printing time (in hours)</label>
    <input id="hours" type="number" min="0" step="0.1" placeholder="e.g. 5.5" />
    <div class="hint">Enter hours only. Decimals allowed (e.g. 5.5 for 5 hours 30 mins).</div>

    <div class="error" id="error"></div>

    <div class="btns">
      <button class="calc" onclick="calculate()">Calculate Cost</button>
      <button class="reset" onclick="resetForm()">Reset</button>
    </div>

    <div class="result" id="result">
      <div class="line"><span>Filament (<span id="rFilament">PLA</span>)</span><span id="rFilCost">₱0.00</span></div>
      <div class="line"><span>Grams used</span><span id="rGrams">0 g</span></div>
      <div class="line"><span>Print time</span><span id="rTime">0 hrs</span></div>
      <div class="line"><span>Time charge</span><span id="rTimeCost">₱0.00</span></div>
      <div class="line total"><span>Total Price</span><span id="rTotal">₱0.00</span></div>
    </div>
  </main>

<script>
  const FILAMENT_RATE = 2.50; // ₱ per gram
  const TIME_RATE = 50;       // ₱ per hour

  function peso(n) {
    return "₱" + n.toLocaleString("en-PH", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function calculate() {
    const filament = document.getElementById("filament").value;
    const grams = parseFloat(document.getElementById("grams").value);
    const hours = parseFloat(document.getElementById("hours").value);
    const errorEl = document.getElementById("error");

    errorEl.textContent = "";

    if (isNaN(grams) || grams < 0) {
      errorEl.textContent = "Please enter a valid amount of filament in grams (0 or more).";
      return;
    }
    if (isNaN(hours) || hours < 0) {
      errorEl.textContent = "Please enter valid printing time in hours (0 or more).";
      return;
    }
    if (grams === 0 && hours === 0) {
      errorEl.textContent = "Enter grams and/or printing time to calculate.";
      return;
    }

    const totalHours = hours;
    const filamentCost = grams * FILAMENT_RATE;
    const timeCost = totalHours * TIME_RATE;
    const total = filamentCost + timeCost;

    document.getElementById("rFilament").textContent = filament;
    document.getElementById("rFilCost").textContent = peso(filamentCost);
    document.getElementById("rGrams").textContent = grams + " g";
    document.getElementById("rTime").textContent = totalHours + " hrs";
    document.getElementById("rTimeCost").textContent = peso(timeCost);
    document.getElementById("rTotal").textContent = peso(total);

    document.getElementById("result").classList.add("show");
  }

  function resetForm() {
    document.getElementById("filament").value = "PLA";
    document.getElementById("grams").value = "";
    document.getElementById("hours").value = "";
    document.getElementById("error").textContent = "";
    document.getElementById("result").classList.remove("show");
  }

  // Allow Enter key to calculate
  document.addEventListener("keydown", function(e) {
    if (e.key === "Enter") calculate();
  });
</script>
</body>
</html>
